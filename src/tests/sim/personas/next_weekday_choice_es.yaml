id: next_weekday_choice_es
description: >
  Spain, says "el próximo domingo" for the start date: within the week it fits this coming
  Sunday and the Sunday after (the demo chat of 2026-10-10 recorded tomorrow). The agent passes
  both dates, the backend offers them as two buttons (ADR 0054), the Candidate taps the later
  one and the backend records it (ADR 0043). Reaches Qualified with no miss counted.
quirks: []
identity:
  name: Marta Ruiz
  phone: "+34600000017"
  country: ES
  locale: es-ES
opening:
  text: "Hola, quiero trabajar de repartidora"
answers:
  full_name: [{text: Marta Ruiz, value: Marta Ruiz}]
  zone: [{text: "Madrid, Chamberí"}]
  driver_license: [{text: "Sí, tengo carnet", value: "yes"}]
  availability: [{text: tiempo completo, value: [full_time]}]
  preferred_schedule: [{text: por la mañana, value: [morning]}]
  experience_years: [{text: 3 años, value: 3}]
  experience_platforms: [{text: Glovo, value: [glovo]}]
  start_date:
    - {text: "El próximo domingo me queda bien", value: ["next:sun", "next:sun+7d"]}
    # The two dates come back as buttons: the Candidate taps the second (a week later).
    - {text: "El de la semana siguiente", pick_option: 1}
expect:
  stage: qualified
  status: open
  fields:
    full_name: {value: Marta Ruiz}
    zone: {non_null: true}
    driver_license: {value: true}
    availability: {value: [full_time]}
    preferred_schedule: {value: [morning]}
    experience_years: {value: 3}
    experience_platforms: {value: [glovo]}
    start_date: {non_null: true}
  field_order:
    [full_name, zone, driver_license, availability, preferred_schedule, experience_years, experience_platforms, start_date]
  events: [application_started, answer_recorded, answer_ambiguous, answer_recorded, screening_finished]
  # One answer_ambiguous: the two Sundays. The tap counts no miss.
  event_counts:
    - {kind: screening_finished, count: 1}
    - {kind: answer_ambiguous, count: 1}
    - {kind: answer_invalid, count: 0}
  forbidden_events: [knockout, escalation_raised, nudge_sent, withdrawn, abandoned]
  tools: [search_zones, record_answer, finish_screening]
  forbidden_tools: [raise_escalation, record_backout]
  nudges: 0
  forbidden_agent_text: [Criba, colonia]
seed_assumptions:
  - "Madrid, Chamberí is inside at least one ES Service Area."
