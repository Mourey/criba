id: zone_country_tomorrow_en
description: >
  The demo chat of 2026-10-10: an English Candidate on a web chat opened as Mexico who lives
  in Chamberí (Madrid) and says "tomorrow works for me" for the start date. The Zone is in
  Spain, so the Application's country follows it (ADR 0057): the zone's answer_recorded
  event says MX to ES, every covering Location is in Spain, and English stays English. The
  start date is recorded as tomorrow with no question and no date choice (the demo asked for
  "the exact date" instead). Reaches Qualified with no miss counted.
quirks: []
identity:
  name: Ramiro Salcedo
  phone: "+525500000018"
  country: MX
  locale: en
opening:
  text: "Hey!"
answers:
  full_name: [{text: Ramiro Salcedo, value: Ramiro Salcedo}]
  zone: [{text: "I live in Chamberi", query: "Chamberí"}]
  driver_license: [{text: "Yes, I have one", value: "yes"}]
  availability: [{text: "Full time", value: [full_time]}]
  preferred_schedule: [{text: Evenings, value: [evening]}]
  experience_years: [{text: "2", value: 2}]
  experience_platforms: [{text: Uber Eats, value: [uber_eats]}]
  start_date: [{text: "tomorrow works for me", value: "+1d"}]
expect:
  stage: qualified
  status: open
  final_language: en
  final_country: ES
  reply_language: en
  fields:
    full_name: {value: Ramiro Salcedo}
    zone: {value: Chamberí}
    driver_license: {value: true}
    availability: {value: [full_time]}
    preferred_schedule: {value: [evening]}
    experience_years: {value: 2}
    experience_platforms: {value: [uber_eats]}
    start_date: {non_null: true}
  field_order:
    [full_name, zone, driver_license, availability, preferred_schedule, experience_years, experience_platforms, start_date]
  events: [application_started, answer_recorded, screening_finished]
  event_counts:
    - {kind: screening_finished, count: 1}
    - {kind: answer_ambiguous, count: 0}
    - {kind: answer_invalid, count: 0}
  forbidden_events: [knockout, escalation_raised, reopened, nudge_sent]
  tools: [search_zones, record_answer, finish_screening]
  forbidden_tools: [raise_escalation, record_backout]
  nudges: 0
  forbidden_agent_text: [Criba]
seed_assumptions:
  - "\"Chamberí\" names exactly one Zone, in Madrid (ES), inside a Service Area."
