  - id: es09
    country: ES
    voice: es_c09
    scenario: Yes/no variants and vehicle types
    turns:
      - text: "Por supuesto, tengo el carné de moto y el de coche."
        checks:
          - {kind: yesno, field: driver_license, expect: "yes"}
          - {kind: choice, group: vehicle, field: vehicle, expect: [moto, car]}
      - text: "Que no, que no he trabajado nunca de repartidor."
