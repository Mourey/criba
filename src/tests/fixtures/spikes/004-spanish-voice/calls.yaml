      - text: "Vale."
        checks: [{kind: yesno, field: confirm, expect: "yes"}]
      - text: "Para nada, no me importa trabajar de noche."
        checks:
          - {kind: yesno, field: objection, expect: "no"}
          - {kind: choice, group: schedule, field: preferred_schedule, expect: [evening]}
      - text: "Con un patinete eléctrico."
        checks: [{kind: choice, group: vehicle, field: vehicle, expect: [e_scooter]}]

  - id: es10
    country: ES
    voice: es_c10
    scenario: Withdrawn, then opt-out
    turns:
      - text: "Hola. Soy Paula Romero."
        checks: [{kind: name, field: full_name, expect: "Paula Romero"}]
      - text: "Mira, ya no me interesa, he encontrado otro curro."
        checks: [{kind: withdraw, field: withdrawn, expect: true}]
      - text: "Dadme de baja, porfa."
