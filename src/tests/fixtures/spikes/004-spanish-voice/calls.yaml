# Scripted Candidate turns for spike 4. Each turn is one utterance (one TTS clip). `text` is what the
# synthetic Candidate says: numbers are written as spoken words so the voice says them the way a
# person would, and `checks` hold the screening value that must be recoverable from the transcript.
#
# Check kinds (scored by spike.py):
#   name    every token of the name appears (accents and case ignored)
#   digits  the digit string appears in a run of numbers ("veintiocho cero diez" -> 28010)
#   yesno   the yes/no reading of the transcript equals `expect`
#   choice  the set of canonical options found in `group` equals `expect`
#   number  `expect` is among the numbers read ("año y medio" -> 1.5, "seis meses" -> 0.5)
#   tokens  every token appears; "a|b" means either
#   optout  an opt-out cue is present; also records whether optout.py's whole-message rule fires
#   withdraw  a withdrawal cue is present
# Age is never asked (Screener skill, "Never"); calls es08 and mx08 have a Candidate volunteer it,
# which exercises numbers only.
calls:
  # ------------------------------------------------------------------ Spain
  - id: es01
    country: ES
    voice: es_c01
    scenario: Qualified path, Madrid
    turns:
      - text: "Hola, sí, soy Lucía Fernández Gil."
        checks: [{kind: name, field: full_name, expect: "Lucía Fernández Gil"}]
      - text: "Vivo en Madrid, en Chamberí. El código postal es el veintiocho cero diez."
        checks:
          - {kind: tokens, field: zone, expect: [chamberi]}
          - {kind: digits, field: postcode, expect: "28010"}
      - text: "Sí, claro, tengo el carné B desde hace años."
        checks: [{kind: yesno, field: driver_license, expect: "yes"}]
      - text: "Con moto, una de ciento veinticinco."
        checks:
          - {kind: choice, group: vehicle, field: vehicle, expect: [moto]}
          - {kind: number, field: engine_cc, expect: 125}
      - text: "Jornada completa."
        checks: [{kind: choice, group: availability, field: availability, expect: [full_time]}]
      - text: "Por las tardes, mejor."
        checks: [{kind: choice, group: schedule, field: preferred_schedule, expect: [afternoon]}]
      - text: "Tres años, primero con Glovo y luego con Uber Eats."
        checks:
          - {kind: number, field: experience_years, expect: 3}
          - {kind: choice, group: platform, field: experience_platforms, expect: [glovo, uber_eats]}
      - text: "Puedo empezar el lunes que viene."
        checks: [{kind: tokens, field: start_date, expect: [lunes]}]
      - text: "Sí, todo correcto."
        checks: [{kind: yesno, field: confirm, expect: "yes"}]

  - id: es02
    country: ES
    voice: es_c02
    scenario: Knockout, no driving licence
    turns:
      - text: "Me llamo Javier Moreno Ruiz."
        checks: [{kind: name, field: full_name, expect: "Javier Moreno Ruiz"}]
      - text: "En Vallecas. Veintiocho cero treinta y ocho."
        checks:
          - {kind: tokens, field: zone, expect: [vallecas]}
          - {kind: digits, field: postcode, expect: "28038"}
      - text: "Qué va, no tengo carné todavía. Me lo estoy sacando."
        checks: [{kind: yesno, field: driver_license, expect: "no"}]
      - text: "Vale, vale. Pues os escribo cuando lo tenga, gracias."
        checks: []

  - id: es03
    country: ES
    voice: es_c03
    scenario: Booking an Interview by spoken date and time (Seville, Andalusian voice)
    turns:
      - text: "Hola, soy Rocío Jiménez Vega."
        checks: [{kind: name, field: full_name, expect: "Rocío Jiménez Vega"}]
      - text: "En Triana, en Sevilla. Cuarenta y uno cero diez."
        checks:
          - {kind: tokens, field: zone, expect: [triana, sevilla]}
          - {kind: digits, field: postcode, expect: "41010"}
      - text: "El jueves a las diez de la mañana me viene genial."
        checks: [{kind: tokens, field: slot, expect: [jueves, "10"]}]
      - text: "Uy, no, espera. Mejor el viernes dieciséis a las cinco y media de la tarde."
        checks: [{kind: tokens, field: slot, expect: [viernes, "16", "5|17", "media|30"]}]
      - text: "Sí, perfecto, ahí estaré."
        checks: [{kind: yesno, field: confirm, expect: "yes"}]

  - id: es04
    country: ES
    voice: es_c04
