      - text: "Media jornada, por las mañanas."
        checks:
          - {kind: choice, group: availability, field: availability, expect: [part_time]}
          - {kind: choice, group: schedule, field: preferred_schedule, expect: [morning]}

  - id: es05
    country: ES
    voice: es_c05
    scenario: Spoken opt-out
    turns:
      - text: "Sí, dime. Soy Marcos Díaz."
        checks: [{kind: name, field: full_name, expect: "Marcos Díaz"}]
      - text: "Baja."
        checks: [{kind: optout, field: opt_out, expect: true}]
      - text: "Que no me llaméis más, por favor."
        checks: [{kind: optout, field: opt_out, expect: true}]
      - text: "Stop."
        checks: [{kind: optout, field: opt_out, expect: true}]

