      - text: "Yes, I mean... sí, sí, tengo carné."
        checks: [{kind: yesno, field: driver_license, expect: "yes"}]
      - text: "Part-time, media jornada, vamos."
        checks: [{kind: choice, group: availability, field: availability, expect: [part_time]}]
      - text: "Mmm, weekends mostly. Los fines de semana."
        checks: [{kind: choice, group: availability, field: availability, expect: [weekends]}]
      - text: "Eh... con la bici, que es eléctrica."
        checks: [{kind: choice, group: vehicle, field: vehicle, expect: [bike]}]

  - id: es07
