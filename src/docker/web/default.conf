# Static React SPA plus a reverse proxy for the backend's public routes.
# /internal/* is deliberately NOT proxied: agent tools are reachable only from
# the Compose network.

upstream criba_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Exact /api has no backend route; answer 404 instead of the SPA shell.
    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://criba_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (Takeover stream, chat replies) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Agent tool endpoints are Compose-network only. Without this block the SPA fallback
    # below would answer 200 with index.html for these paths, which hides the intent.
    location ^~ /internal/ {
        return 404;
    }
    location = /internal {
        return 404;
    }

    # Vite emits content-hashed files here, so they are safe to cache for a year. A missing
    # file is a real 404, never the SPA shell.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (/book/:token, /test-chat, /login, /applications/:id, ...): every
    # other path that is not a file falls back to the SPA shell, which the router resolves.
    # index.html itself must never be cached, or a deploy would keep serving stale hashes.
    # No `$uri/` here: a directory match would redirect instead of serving the shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
