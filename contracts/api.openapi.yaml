paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with a seeded user; sets the session cookie
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: recruiter.puebla@gruposazon.example, password: demo-password }
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema: { type: string }
              example: criba_session=abc123; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user: { id: usr_rec_puebla, name: Ana Torres, email: recruiter.puebla@gruposazon.example, role: recruiter }
                locations:
                  - { id: loc_mx_puebla_centro, name: Sazón Puebla Centro, country: MX, city: Puebla }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      x-roles: [recruiter, operator]
      responses:
        '204': { description: Logged out; cookie cleared }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, role and Location scope
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user: { id: usr_op_1, name: Alex Moreno, email: operator@criba.example, role: operator }
                locations: []
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/locations:
    get:
      tags: [locations]
      operationId: listLocations
      summary: Locations in the caller's scope (all for Operators)
      x-roles: [recruiter, operator]
      parameters:
        - { name: country, in: query, schema: { $ref: '#/components/schemas/Country' } }
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Location' } }
              example:
                items:
                  - { id: loc_mx_puebla_centro, name: Sazón Puebla Centro, country: MX, city: Puebla, timezone: America/Mexico_City }
                  - { id: loc_es_madrid_chamberi, name: Sazón Chamberí, country: ES, city: Madrid, timezone: Europe/Madrid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: List and filter Applications
      x-roles: [recruiter, operator]
      parameters:
        - { name: location_id, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { $ref: '#/components/schemas/Country' } }
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
        - name: stage
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Stage' } }
        - name: outcome
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Outcome' } }
        - name: flag
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        - { name: claimed_by, in: query, description: "A user id, or `me`, or `none`.", schema: { type: string } }
        - { name: created_from, in: query, schema: { type: string, format: date } }
        - { name: created_to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: Search the Candidate's name or phone., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [-updated_at, updated_at, -created_at, created_at, -time_in_stage], default: -updated_at } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of Applications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationList' }
              example:
                items:
                  - *app_summary_qualified
                next_cursor: null
                total: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/applications/{application_id}:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [applications]
      operationId: getApplication
      summary: Application detail (transcript, answers, timeline, summary, other Applications)
      description: The `cost` object is present for Operators only.
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationDetail' }
              examples:
                qualified: { $ref: '#/components/examples/ApplicationDetailQualified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/jev-readings:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [applications]
      operationId: getJevReadings
      summary: Every typed Candidate message's stored Jev reading, with the thresholds (Operators only)
      description: >-
        What the Jev router stored for each typed Candidate message on the Application (ADR 0051,
        ADR 0066), oldest first: one entry per typed text message, calm and unreadable ones
        included. Taps, spoken messages, system turns and blank messages have no entry. Read-only,
        for calibration and incident review; display only, never an input to a Knockout, Rejection
        or Approval. Ids, codes and numbers only: no message text. Recruiters get 403, whatever the
        Application's Location.
        `status` is `ok`, `error` or `timeout` as stored; `expired` when there is no row and the
        message is older than the retention period (`CRIBA_SIGNALS_RETENTION_DAYS`, default 180);
        `not_read` when there is no row otherwise (Jev off, a Takeover, an opt-out or a failed
        read, which the stored data cannot tell apart). `reading` is present only when `status`
        is `ok`; `stage` is null when there is no row.
        Bar-to-threshold mapping for a panel that draws the probabilities as bars. Switch gets
        `switch_noul`; frustrated gets `frustrated`; confused gets `confused`; wants-human gets
        two markers, `wants_human_hint` (labelled "hint") and `wants_human_escalate` (labelled
        "Escalation"); abusive gets `abusive_escalate`. The language confidence is read against
        `first_confidence` or `switch_confidence`, not as a bar. Each reading carries its stored
        `policy_version`; a consumer may draw a threshold marker only when that version equals
        `thresholds.version`. A threshold value drives nothing but the drawing.
        `ask_confidence` (the explicit language request, ADR 0061), `readable` and `unreadable`
        (ADR 0063) are in `thresholds` but draw no bar: no probability bar carries them.
      x-roles: [operator]
      x-operator-only: true
      responses:
        '200':
          description: The Application's readings and the current thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JevReadings' }
              example:
                application_id: app_01JA2B3C4D5E6F7G8H9J0K
                thresholds:
                  version: jev-1.13-v1
                  first_confidence: 0.7
                  switch_confidence: 0.6
                  switch_noul: 0.85
                  frustrated: 0.8
                  confused: 0.75
                  wants_human_hint: 0.7
                  wants_human_escalate: 0.85
                  abusive_escalate: 0.85
                  ask_confidence: 0.8
                  readable: 0.2
                  unreadable: 0.5
                readings:
                  - message_id: 41
                    at: '2026-10-11T09:31:00Z'
                    stage: greeting
                    status: ok
                    reading:
                      lang: es
                      lang_confidence: 0.99
                      switch: 0.02
                      frustrated: 0.03
                      confused: 0.03
                      wants_human: 0.02
                      abusive: 0.01
                      fired: []
                      hint: null
                      escalation: null
                      model: typesafe/jev-1.13-20260917
                      policy_version: jev-1.13-v1
                      first_message: true
                      language_set: es-MX
                  - { message_id: 43, at: '2026-10-11T09:33:10Z', stage: start_date, status: timeout, reading: null }
                  - { message_id: 45, at: '2026-10-11T09:35:40Z', stage: null, status: not_read, reading: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/export:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [applications]
      operationId: exportApplication
      summary: The Application's structured JSON (every screening field, Phase 2 requirements)
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: Application JSON export
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="app_01JA2B3C4D5E6F7G8H9J0K.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationExport' }
              example: *app_export_qualified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/tool-calls:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [applications]
      operationId: getToolCalls
      summary: The agent's tool calls on an Application, grouped by run (Operators only)
      description: >-
        One group per agent run, oldest first, then a final group with a null `run_id` for the
        calls no run claimed (a run that never returned, or a call that came after its run
        ended). Each run carries its tokens, cost, latency and status from its usage row and the
        ids of the reply messages it produced; those fields are null for a run with no usage
        row and for the unlinked group. A call holds its tool, start time, duration, outcome and
        error code, and its arguments as field names with canonical values only: a free-text
        argument keeps its name and a null value (ADR 0035, ADR 0069). Never a tool's result,
        a hint or message text.
      x-roles: [operator]
      x-operator-only: true
      responses:
        '200':
          description: The tool calls, by run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolCallTrace' }
              example:
                application_id: app_01JA2B3C4D5E6F7G8H9J0K
                runs:
                  - run_id: run_01
                    status: ok
                    input_tokens: 7200
                    output_tokens: 410
                    cost_usd: 0.0031
                    latency_ms: 1700
                    reply_message_ids: [12]
                    calls:
                      - { tool: get_application, started_at: '2026-10-11T09:31:01Z', duration_ms: 6, outcome: ok, error: null, args: {} }
                      - { tool: record_answer, started_at: '2026-10-11T09:31:02Z', duration_ms: 9, outcome: ok, error: null, args: { field: driver_license, value: 'yes' } }
                  - run_id: null
                    status: null
                    input_tokens: null
                    output_tokens: null
                    cost_usd: null
                    latency_ms: null
                    reply_message_ids: []
                    calls:
                      - { tool: record_answer, started_at: '2026-10-11T09:40:00Z', duration_ms: 7, outcome: invalid, error: invalid_value, args: { field: start_date, value: null } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/booking/invite.ics:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [slots]
      operationId: downloadApplicationInvite
      summary: Download the Application's booked Interview as .ics (the Recruiter's copy of the invite)
      description: The same iCalendar file, with the same UID, that the Candidate gets from the public booking page, so both calendars hold one event. 404 when the Application has no active booking (none made, or released). Criba never writes to an external calendar (ADR 0012); this download is how the invite reaches the Recruiter.
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: iCalendar invite
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="entrevista.ics"
          content:
            text/calendar:
              schema: { type: string }
              example: |
                BEGIN:VCALENDAR
                VERSION:2.0
                PRODID:-//Criba//Screening//EN
                BEGIN:VEVENT
                UID:bk_01JA@criba
                DTSTART:20261014T160000Z
                DTEND:20261014T163000Z
                SUMMARY:Entrevista Grupo Sazón
                LOCATION:Av. Reforma 123, Centro, Puebla
                END:VEVENT
                END:VCALENDAR
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/claim:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [claims]
      operationId: claimApplication
      summary: Take a Claim on the Application
      description: Atomic. Fails with 409 `already_claimed` if another Recruiter holds it (use the take-over route for a Claimed, idle Application).
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              example: { user_id: usr_rec_puebla, user_name: Ana Torres, claimed_at: '2026-10-09T10:00:00Z', last_action_at: '2026-10-09T10:00:00Z', idle: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [claims]
      operationId: releaseClaim
      summary: Release the caller's Claim
      x-roles: [recruiter, operator]
      responses:
        '204': { description: Released }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/claim/takeover:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [claims]
      operationId: takeOverIdleClaim
      summary: Take over a Claimed, idle Claim (no action for 7 days)
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: Claim moved to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              example: { user_id: usr_rec_puebla, user_name: Ana Torres, claimed_at: '2026-10-16T10:00:00Z', last_action_at: '2026-10-16T10:00:00Z', idle: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/applications/{application_id}/rejection:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [queue]
      operationId: rejectApplication
      summary: End the Application with a Rejection, at any stage
      description: Confirming sends the client-approved Rejection template to the Candidate.
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectionRequest' }
            example: { reason: no_show, note: No se presentó a la entrevista del miércoles. }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationSummary' }
              example: *app_summary_rejected
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/queue:
    get:
      tags: [queue]
      operationId: listQueue
      summary: Review queue (Approvals, Reviews, Escalations)
      x-roles: [recruiter, operator]
      parameters:
        - name: kind
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/QueueKind' } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved], default: open } }
        - { name: location_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Queue items, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueList' }
              example:
                items:
                  - id: qi_approval_1
                    kind: approval
                    status: open
                    reason: null
                    note: null
                    created_at: '2026-10-09T10:05:00Z'
                    application: *app_summary_qualified
                  - id: qi_esc_7
                    kind: escalation
                    status: open
                    reason: unanswered_question
                    note: Asks whether the motorbike is provided.
                    created_at: '2026-10-09T11:00:00Z'
                    application: *app_summary_qualified
                next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/queue/stream:
    get:
      tags: [queue]
      operationId: streamQueue
      summary: Server-sent events for queue changes in the caller's scope
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: 'Event stream. Each `data:` line is a JSON `StreamEvent` with type `queue`.'
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: queue
                data: {"type":"queue","at":"2026-10-09T11:00:00Z","data":{"item_id":"qi_esc_7","kind":"escalation","status":"open","application_id":"app_01JA2B3C4D5E6F7G8H9J0K"}}

        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/queue/approvals/{item_id}:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    post:
      tags: [queue]
      operationId: resolveApproval
      summary: Resolve an Approval (Approved, or Rejection with a reason)
      description: On Approved, the Screening Agent writes at once and offers 3 Interview slots (ADR 0030).
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
            examples:
              approved: { value: { decision: approved } }
              rejected: { value: { decision: rejected, reason: role_filled, note: null } }
      responses:
        '200': { $ref: '#/components/responses/QueueItemResolved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/queue/reviews/{item_id}:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    post:
      tags: [queue]
      operationId: resolveReview
      summary: Resolve a Review of a Knockout (Upheld or Overturned)
      description: Overturned reopens the Application and Screening continues.
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecision' }
            example: { decision: overturned, note: El candidato tiene licencia; la respuesta se entendió mal. }
      responses:
        '200': { $ref: '#/components/responses/QueueItemResolved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/queue/escalations/{item_id}:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    post:
      tags: [queue]
      operationId: resolveEscalation
      summary: Resolve an Escalation (dismiss, or start a Takeover)
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalationDecision' }
            example: { decision: takeover }
      responses:
        '200': { $ref: '#/components/responses/QueueItemResolved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/applications/{application_id}/takeover:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [takeover]
      operationId: startTakeover
      summary: Start a Takeover (pause the agent, tell the Candidate a team member joined)
      x-roles: [recruiter, operator]
      responses:
        '200':
          description: Caller now holds the chat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakeoverState' }
              example: { control: human, user_id: usr_rec_puebla, user_name: Ana Torres, since: '2026-10-09T11:02:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/applications/{application_id}/takeover/messages:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [takeover]
      operationId: sendTakeoverMessage
      summary: Send a message to the Candidate as the team member holding the chat
      description: |
        A message typed by a person during a Takeover is a human reply: quiet hours do not hold
        it. On WhatsApp, outside the 24-hour window since the Candidate's last message, only an
        approved template may go out, so free text is refused with 409 `outside_whatsapp_window`
        and nothing is sent. The automated "a team member has joined" notice follows the same
        rule as the replies it goes with.
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakeoverMessageRequest' }
            example: { text: 'Hola Luis, soy Ana del equipo de Grupo Sazón. Sí, la motoneta la pone la empresa.' }
      responses:
        '201':
          description: Sent and logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                id: 42
                direction: outbound
                sender: human
                sender_name: Ana Torres
                content_type: text
                body: 'Hola Luis, soy Ana del equipo de Grupo Sazón. Sí, la motoneta la pone la empresa.'
                interactive: null
                created_at: '2026-10-09T11:03:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Outside WhatsApp's 24-hour window; only an approved template may be sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: outside_whatsapp_window, message: 'The Candidate last wrote more than 24 hours ago, so WhatsApp allows only an approved template now. The message was not sent; it can go once the Candidate writes again.' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/applications/{application_id}/takeover/handback:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [takeover]
      operationId: handBack
      summary: Hand the chat back to the Screening Agent
      description: The next agent run receives `summary` (or a generated one) of what was said during the Takeover.
      x-roles: [recruiter, operator]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandBackRequest' }
            example: { summary: Confirmed the company provides the motorbike. Continue with availability. }
      responses:
        '200':
          description: Agent holds the chat again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakeoverState' }
              example: { control: agent, user_id: null, user_name: null, since: '2026-10-09T11:10:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/stream:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [takeover]
      operationId: streamApplication
      summary: Server-sent events for one Application (live relay during a Takeover)
      description: Emits `message` (new inbound or outbound message), `control` (Takeover started or handed back) and `event` (timeline entry). Supports `Last-Event-ID`, which is the message or event id.
      x-roles: [recruiter, operator]
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: 'Event stream. Each `data:` line is a JSON `StreamEvent`.'
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: m-43
                event: message
                data: {"type":"message","at":"2026-10-09T11:04:00Z","data":{"id":43,"direction":"inbound","sender":"candidate","sender_name":null,"content_type":"text","body":"¡Perfecto, gracias!","interactive":null,"created_at":"2026-10-09T11:04:00Z"}}

        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/applications/{application_id}/booking-link:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [slots]
      operationId: createBookingLink
      summary: Create a signed, expiring booking link for an Approved Application
      x-roles: [recruiter, operator]
      responses:
        '201':
          description: Booking link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingLink' }
              example: { url: 'https://empleo.gruposazon.example/book/eyJhcHAiOiJ...', token: eyJhcHAiOiJ..., expires_at: '2026-10-16T10:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/slots:
    get:
      tags: [slots]
      operationId: listSlots
      summary: Interview slots at Locations in scope
      x-roles: [recruiter, operator]
      parameters:
        - { name: location_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SlotStatus' } }
      responses:
        '200':
          description: Slots
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Slot' } }
              example:
                items:
                  - *slot_open
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [slots]
      operationId: createSlots
      summary: Publish one or more Interview slots for a Location
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotCreateRequest' }
            example:
              location_id: loc_mx_puebla_centro
              slots:
                - { starts_at: '2026-10-14T16:00:00Z', ends_at: '2026-10-14T16:30:00Z' }
                - { starts_at: '2026-10-14T22:00:00Z', ends_at: '2026-10-14T22:30:00Z' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Slot' } }
              example:
                items:
                  - *slot_open
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/slots/{slot_id}:
    parameters:
      - { $ref: '#/components/parameters/SlotId' }
    patch:
      tags: [slots]
      operationId: updateSlot
      summary: Move an unbooked slot
      x-roles: [recruiter, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotUpdate' }
            example: { starts_at: '2026-10-14T17:00:00Z', ends_at: '2026-10-14T17:30:00Z' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: *slot_open
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [slots]
      operationId: cancelSlot
      summary: Cancel a slot (409 if booked; reject or reschedule the booking first)
      x-roles: [recruiter, operator]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/public/booking/{token}:
    parameters:
      - { $ref: '#/components/parameters/BookingToken' }
    get:
      tags: [public-booking]
      operationId: getBookingPage
      summary: Open slots for the covering Locations (public, signed token)
      description: Exposes no Candidate data beyond the first name and language. Expired or invalid tokens return 410 or 404.
      security: []
