                language: es-MX
                expires_at: '2026-10-16T10:00:00Z'
                current_booking: null
                slots:
                  - { slot_id: slot_8x2, starts_at: '2026-10-14T16:00:00Z', ends_at: '2026-10-14T16:30:00Z', local_label: 'mié 14 · 10:00', location_name: Sazón Puebla Centro, address: 'Av. Reforma 123, Centro, Puebla' }
                  - { slot_id: slot_8x3, starts_at: '2026-10-15T17:00:00Z', ends_at: '2026-10-15T17:30:00Z', local_label: 'jue 15 · 11:00', location_name: Sazón Puebla Centro, address: 'Av. Reforma 123, Centro, Puebla' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    post:
      tags: [public-booking]
      operationId: bookFromPage
      summary: Book one slot (public, signed token); returns a link to download the .ics
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingRequest' }
            example: { slot_id: slot_8x2 }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingConfirmation' }
              example:
                interview: { starts_at: '2026-10-14T16:00:00Z', ends_at: '2026-10-14T16:30:00Z', local_label: 'mié 14 · 10:00', location_name: Sazón Puebla Centro, address: 'Av. Reforma 123, Centro, Puebla' }
                ics_url: /api/public/booking/eyJhcHAiOiJ.../invite.ics
                message: '¡Listo, Luis! Tu entrevista quedó para el miércoles 14 a las 10:00 en Sazón Puebla Centro. Descarga la invitación para tu calendario.'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/public/booking/{token}/invite.ics:
    parameters:
      - { $ref: '#/components/parameters/BookingToken' }
    get:
      tags: [public-booking]
      operationId: downloadInvite
      summary: Download the booked Interview as .ics
      security: []
      x-roles: [public]
      responses:
        '200':
          description: iCalendar invite
          content:
            text/calendar:
              schema: { type: string }
              example: |
                BEGIN:VCALENDAR
                VERSION:2.0
                PRODID:-//Criba//Interview//ES
                BEGIN:VEVENT
                UID:bk_01JA@criba
                DTSTART:20261014T160000Z
                DTEND:20261014T163000Z
                SUMMARY:Entrevista Grupo Sazón
                LOCATION:Av. Reforma 123, Centro, Puebla
                END:VEVENT
                END:VCALENDAR
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: List Test chat and Demo stage conversations, typed and spoken (Operators only)
      description: >-
        Web chat and voice conversations whose recorded `client` is `test_chat` or `demo`, newest
        first by creation time; `channel` tells a typed conversation (`webchat`) from a spoken one
        (`voice`). Conversations started before the origin was recorded, simulator runs and
        WhatsApp identities are not listed. A `conversation_id` is a bearer secret for the public
        web chat API: it is handed only to Operators.
      x-roles: [operator]
      x-operator-only: true
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationList' }
              example:
                items:
                  - conversation_id: wc_0f3a9c2d4b6e48a1b7c5d9e1f2a3b4c5
                    channel: webchat
                    client: demo
                    persona_id: diego_es
                    phone: null
                    created_at: '2026-10-11T09:30:00Z'
                    shared_phone: false
                    last_message_at: '2026-10-11T09:34:12Z'
                    application: { id: app_01JA2B3C4D5E6F7G8H9J0K, stage: zone, outcome: null, status: open }
                next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/conversations/{conversation_id}:
    parameters:
      - name: conversation_id
        in: path
        required: true
        description: The conversation id (`wc_` for web chat or `wv_` for voice, then 32 hex characters). A bearer secret.
        schema: { type: string }
    get:
      tags: [conversations]
      operationId: getConversation
      summary: Read one Test chat or Demo stage conversation, typed or spoken (Operators only)
      description: >-
        The conversation with the Candidate's messages on its own channel, oldest first: the typed
        messages of a `webchat` conversation, the spoken transcript of a `voice` one (each message
        carries its `modality`; no audio is stored). Messages are stored per Candidate and channel,
        so two conversations of one channel that share a phone share their messages. Read-only:
        no other method is allowed on this path. An unknown id, and one whose `client` is null or
        `simulator`, answers 404.
      x-roles: [operator]
      x-operator-only: true
      responses:
        '200':
          description: The conversation and its messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
              example:
                conversation_id: wc_0f3a9c2d4b6e48a1b7c5d9e1f2a3b4c5
                channel: webchat
                client: test_chat
                persona_id: null
                phone: '+525512345678'
                created_at: '2026-10-11T09:30:00Z'
                shared_phone: false
                last_message_at: '2026-10-11T09:31:02Z'
                application: { id: app_01JA2B3C4D5E6F7G8H9J0K, stage: greeting, outcome: null, status: open }
                messages:
                  - { id: 1, direction: inbound, sender: candidate, content_type: text, body: Hola, created_at: '2026-10-11T09:31:00Z' }
                  - { id: 2, direction: outbound, sender: agent, content_type: text, body: 'Hola, soy el asistente de Sazón.', created_at: '2026-10-11T09:31:02Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

