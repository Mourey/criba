openapi: 3.1.0
info:
  title: Criba web app API
  version: 0.1.0-phase2
  summary: REST API behind the Recruiter and Operator web app (spec 003).
  description: |
    Owner after wave 0: lane D (web app and REST API). Frozen by spec 005; change only
    through lane D, in a separate commit listed in the wave merge notes.

    Vocabulary follows `CONTEXT.md`. Answer fields and canonical values follow
    `docs/case/phase-1-detailed-spec.md` section 3 and `contracts/tools.json`.

    **Auth.** `POST /api/auth/login` sets an HttpOnly session cookie (`criba_session`).
    Every other `/api` route needs it, except `/api/public/*`, which is reached by a signed,
    expiring booking token and exposes nothing but open slots.

    **Roles.** Each operation lists the roles allowed in `x-roles`. Recruiters are scoped to
    their own Locations: an Application is visible when any of its covering Locations is in
    the Recruiter's scope; anything else returns 404. Operators see every Location.

    **Cost fields.** Properties marked `x-roles: [operator]` are Operator-only. The server
    removes them for Recruiters (they are absent from the JSON, not null). The UI must not be
    the only guard.

    **Live updates** use server-sent events (`text/event-stream`), never WebSockets.

    **Errors** always use the `Error` schema.
  contact:
    name: Criba lane D
servers:
  - url: http://localhost:8080
    description: nginx in Compose (proxies /api to the backend)
  - url: http://localhost:4010
    description: Prism mock (`npx @stoplight/prism-cli mock contracts/api.openapi.yaml -p 4010`)
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: locations
  - name: applications
  - name: claims
  - name: queue
  - name: takeover
  - name: slots
  - name: public-booking
  - name: conversations
  - name: metrics

