# Pytest config for runs from the repo root (`uv run --project src/backend pytest -q`).
# Mirrors [tool.pytest.ini_options] in src/backend/pyproject.toml, which only applies
# when pytest runs from src/backend. Keep the two in step.
[pytest]
testpaths = src/backend/tests src/tests
addopts = -ra --import-mode=importlib
markers =
    hermes: needs the hermes container running (docker compose up -d hermes)
    e2e: needs a running sim stack (CRIBA_E2E_BASE_URL); skipped otherwise
